name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: fmt, clippy, test, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@f360235162158ca4526b07999d99c38ade05a414 # cargo-nextest
      - uses: taiki-e/install-action@977cdbe2e748fc9d5798e3098868c4c4463bf31b # cargo-audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo nextest run --locked

      - name: Audit
        run: cargo audit

      - name: CycloneDX 1.6 schema
        run: |
          set -euo pipefail
          mkdir -p target/cdx-schema
          curl -fsSL -o target/cdx-schema/bom-1.6.schema.json \
            https://raw.githubusercontent.com/CycloneDX/specification/1.6.1/schema/bom-1.6.schema.json
          curl -fsSL -o target/cdx-schema/spdx.schema.json \
            https://raw.githubusercontent.com/CycloneDX/specification/1.6.1/schema/spdx.schema.json
          set +e
          cargo run --locked --bin lockward -- scan lockward-core/tests/fixtures/report/licenses --offline --format cyclonedx --output target/licenses.cdx.json
          code=$?
          set -e
          if [ "$code" -gt 1 ]; then
            exit "$code"
          fi
          if command -v pipx >/dev/null 2>&1; then
            pipx run check-jsonschema --schemafile target/cdx-schema/bom-1.6.schema.json target/licenses.cdx.json
          else
            python3 -m pip install --break-system-packages --disable-pip-version-check check-jsonschema
            check-jsonschema --schemafile target/cdx-schema/bom-1.6.schema.json target/licenses.cdx.json
          fi
