name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p lockward-cli --target ${{ matrix.target }}

      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/lockward"
          tar -C "$(dirname "$bin")" -czf "lockward-${{ matrix.target }}.tar.gz" "$(basename "$bin")"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/lockward.exe" -DestinationPath "lockward-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: lockward-${{ matrix.target }}
          path: lockward-${{ matrix.target }}.*
          if-no-files-found: error

  sign-and-publish:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign checksums
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.pem \
            dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.pem
