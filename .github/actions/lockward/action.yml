name: Lockward
description: Static supply-chain scan for npm lockfiles. Mode 1 does not execute package code.
author: YaDe Labs
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Project directory or package-lock.json
    required: false
    default: .
  mode:
    description: warn or enforce
    required: false
    default: warn
  policy:
    description: Optional YAML policy. Empty uses the built-in warn-first policy.
    required: false
    default: ""
  offline:
    description: Use only the advisory cache (true/false)
    required: false
    default: "false"
  lockward-bin:
    description: Path or name of the lockward binary
    required: false
    default: lockward
  token:
    description: Token for the pull-request comment
    required: false
    default: ${{ github.token }}
  comment:
    description: Post the Markdown as a pull-request comment (true/false)
    required: false
    default: "true"
  scanned-at:
    description: Optional RFC3339 timestamp for reproducible reports
    required: false
    default: ""

outputs:
  exit-code:
    description: Gate exit code (0 OK, 1 Warning, 2 Fail)
    value: ${{ steps.scan.outputs.exit-code }}
  report-json:
    description: Path to report.json
    value: ${{ steps.scan.outputs.report-json }}

runs:
  using: composite
  steps:
    - id: scan
      shell: bash
      env:
        LOCKWARD_BIN: ${{ inputs.lockward-bin }}
        LOCKWARD_PATH: ${{ inputs.path }}
        LOCKWARD_MODE: ${{ inputs.mode }}
        LOCKWARD_POLICY: ${{ inputs.policy }}
        LOCKWARD_OFFLINE: ${{ inputs.offline }}
        LOCKWARD_SCANNED_AT: ${{ inputs.scanned-at }}
        LOCKWARD_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        out="${RUNNER_TEMP:-/tmp}/lockward-out"
        mkdir -p "$out"
        args=(scan "$LOCKWARD_PATH" --format all --output "$out" --mode "$LOCKWARD_MODE")
        if [ -n "$LOCKWARD_POLICY" ]; then
          args+=(--policy "$LOCKWARD_POLICY")
        fi
        if [ "$LOCKWARD_OFFLINE" = "true" ]; then
          args+=(--offline)
        fi
        if [ -n "$LOCKWARD_SCANNED_AT" ]; then
          args+=(--scanned-at "$LOCKWARD_SCANNED_AT")
        fi
        set +e
        "$LOCKWARD_BIN" "${args[@]}"
        code=$?
        set -e
        if [ -n "${GITHUB_OUTPUT:-}" ]; then
          echo "exit-code=$code" >> "$GITHUB_OUTPUT"
          echo "report-json=$out/report.json" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$out/summary.md" ]; then
          cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
        fi
        if [ "$LOCKWARD_COMMENT" = "true" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$out/comment.md"
        fi
        exit "$code"
