[package]
name = "lockward-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Lockward command-line scanner."
readme = "README.md"
autobins = false

[[bin]]
name = "lockward"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
lockward-core = { version = "0.1.0", path = "../lockward-core" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"

[lints]
workspace = true
