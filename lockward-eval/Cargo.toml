[package]
name = "lockward-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Offline corpus harness for Lockward hook and heuristic detection."
readme = "README.md"
autobins = false

[[bin]]
name = "lockward-eval"
path = "src/main.rs"

[dependencies]
lockward-core = { version = "0.1.0", path = "../lockward-core" }
noyalib = { version = "=0.0.57", features = ["compat-serde-yaml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"

[lints]
workspace = true
