# Eval policy. Same defaults as the product policy, except advisory_coverage
# is allow: an offline run must not count missing OSV coverage as a detection.
version: 1
mode: warn
rules:
  install_scripts:
    action: review
    allow:
      - "@grpc/grpc-js"
      - "@mapbox/node-pre-gyp"
      - "@swc/core"
      - bcrypt
      - better-sqlite3
      - canvas
      - core-js
      - cypress
      - electron
      - esbuild
      - fsevents
      - grpc
      - node-gyp
      - node-pre-gyp
      - node-sass
      - playwright
      - prebuild-install
      - puppeteer
      - re2
      - sass
      - sharp
      - sodium-native
      - sqlite3
  no_outbound_build:
    action: fail
    allow_domains: []
  new_dependencies:
    action: review
  known_vulnerable:
    action: fail
    min_severity: high
  secret_path_access:
    action: fail
  advisory_coverage:
    action: allow
