# Eval policy. Same defaults as the product policy, except advisory_coverage
# is allow: an offline run must not count missing OSV coverage as a detection.
version: 1
mode: warn
rules:
  install_scripts:
    action: warn
    allow: []
  no_outbound_build:
    action: fail
    allow_domains: []
  new_dependencies:
    action: review
  known_vulnerable:
    action: fail
    min_severity: high
  secret_path_access:
    action: fail
  advisory_coverage:
    action: allow
