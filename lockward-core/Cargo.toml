[package]
name = "lockward-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Static supply-chain analysis library for the Lockward scanner."
readme = "README.md"

[dependencies]
hex = "0.4.3"
noyalib = { version = "0.0.57", features = ["compat-serde-yaml"] }
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
thiserror = "2"
tracing = "0.1.44"

[lints]
workspace = true
