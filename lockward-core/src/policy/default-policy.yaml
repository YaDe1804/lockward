version: 1
mode: warn
rules:
  install_scripts:
    action: review
    allow: []
  no_outbound_build:
    # Fail is pipe-to-shell. A download that does not execute is review.
    action: fail
    allow_domains: []
  new_dependencies:
    action: review
  known_vulnerable:
    action: fail
    min_severity: high
  secret_path_access:
    action: fail
  advisory_coverage:
    action: warn
